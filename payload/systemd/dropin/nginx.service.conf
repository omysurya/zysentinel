# ZySentinel: sebelum nginx start (termasuk restart oleh upgrade nginx di aaPanel), pastikan modul Coraza yang dimuat cocok dengan biner nginx.
# Bila tidak cocok (nginx di-upgrade), konfigurasi WAF dilepas sementara (dengan cadangan) supaya nginx tetap start tanpa downtime, lalu
# sentinel-coraza-sesuai.service meng-compile konektor untuk versi baru dan memulihkan proteksi. Awalan "-" dan timeout: kegagalan atau
# kelambatan pemeriksaan ini TIDAK PERNAH menghalangi nginx start. Dipasang sebagai <unit>.d/zysentinel-restart.conf (jalur drop-in plugin).
[Service]
ExecStartPre=-/usr/bin/timeout 30 /www/server/sentinel/bin/sentinel-waf.sh nginx-prestart
