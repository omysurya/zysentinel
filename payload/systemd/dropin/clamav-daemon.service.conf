# ZySentinel: clamd bawaan distro memakai Restart=no, jadi sekali crash ia mati selamanya dan pemindaian upload
# kehilangan tanda tangan ClamAV. Pemulihan di sini dibatasi: jeda naik bertahap dan berhenti setelah 4 kali
# dalam 30 menit (sentinel-selfheal melanjutkan dengan jeda makin panjang). Memuat basis data memakan CPU dan
# RAM besar, jadi jedanya lebih panjang daripada layanan lain.
[Unit]
StartLimitIntervalSec=1800
StartLimitBurst=4

[Service]
Restart=on-failure
RestartForceExitStatus=0 SIGTERM SIGHUP SIGINT SIGPIPE
RestartSec=5
RestartSteps=4
RestartMaxDelaySec=120
TimeoutStartSec=300
LogRateLimitIntervalSec=30s
LogRateLimitBurst=100
