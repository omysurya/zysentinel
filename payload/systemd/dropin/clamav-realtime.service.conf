# ZySentinel: layanan pemindai realtime milik operator memakai Restart=always dengan batas bawaan systemd
# (5 kali per 10 detik) yang tidak pernah tercapai pada RestartSec=10, sehingga bisa berputar tanpa akhir.
# Drop-in ini hanya menambah batas dan jeda bertahap; perilaku Restart=always milik operator tidak diubah.
[Unit]
StartLimitIntervalSec=900
StartLimitBurst=6

[Service]
RestartSteps=5
RestartMaxDelaySec=120
LogRateLimitIntervalSec=30s
LogRateLimitBurst=100
