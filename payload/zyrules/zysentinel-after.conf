# ============================================================
# ZySentinel Rules: aturan CADANGAN (dimuat SESUDAH OWASP CRS)
#
# Aktif HANYA bila OWASP CRS tidak dimuat (tx.crs_setup_version kosong),
# supaya tidak memeriksa dua kali dan tidak bentrok dengan CRS. Dengan CRS
# aktif, SQLi/XSS/RCE/traversal ditangani CRS dan seluruh berkas ini dilewati.
# ID 8000900-8000999.
# ============================================================

# --- penentuan: apakah cadangan aktif (fase 1, sesudah crs-setup dimuat)
SecAction "id:8000900,phase:1,pass,nolog,t:none,setvar:tx.zy_fallback_on=%{tx.zy_fallback}"
SecRule &TX:CRS_SETUP_VERSION "@gt 0" "id:8000901,phase:1,pass,nolog,t:none,setvar:tx.zy_fallback_on=0"
SecRule TX:ZY_SKIP "@eq 1" "id:8000902,phase:1,pass,nolog,t:none,setvar:tx.zy_fallback_on=0"

SecRule TX:ZY_FALLBACK_ON "!@eq 1" "id:8000903,phase:1,pass,nolog,t:none,skipAfter:ZY_END_FALLBACK1"

# Path traversal pada URI
SecRule REQUEST_URI_RAW|REQUEST_FILENAME "@rx (?:^|[/\x5c])\.\.(?:[/\x5c;]|$)" \
    "id:8000910,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:lowercase,\
    msg:'ZySentinel (cadangan): path traversal pada URI',tag:'zysentinel',tag:'attack-lfi',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

SecMarker ZY_END_FALLBACK1

SecRule TX:ZY_FALLBACK_ON "!@eq 1" "id:8000904,phase:2,pass,nolog,t:none,skipAfter:ZY_END_FALLBACK2"

# SQL injection: libinjection lalu pola regex
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:Referer "@detectSQLi" \
    "id:8000920,phase:2,deny,status:403,log,auditlog,t:none,t:utf8toUnicode,t:urlDecodeUni,t:removeNulls,\
    msg:'ZySentinel (cadangan): SQL injection (libinjection)',tag:'zysentinel',tag:'attack-sqli',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|XML:/*|REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:Referer "@rx (?:union[\s/*+]+(?:all[\s/*+]+)?select|drop[\s/*+]+(?:table|database)|(?:or|and)[\s/*+]+[0-9]+[\s/*+]*=[\s/*+]*[0-9]+|'[\s/*+]*(?:or|and)[\s/*+]+'?[a-z0-9]+'?[\s/*+]*=|sleep[\s/*+]*\([\s/*+]*[0-9]+|benchmark[\s/*+]*\(|information_schema|load_file[\s/*+]*\(|into[\s/*+]+(?:out|dump)file|waitfor[\s/*+]+delay|extractvalue[\s/*+]*\(|updatexml[\s/*+]*\()" \
    "id:8000921,phase:2,deny,status:403,log,auditlog,t:none,t:utf8toUnicode,t:urlDecodeUni,t:removeNulls,t:replaceComments,t:lowercase,\
    msg:'ZySentinel (cadangan): SQL injection (pola)',tag:'zysentinel',tag:'attack-sqli',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# Cross-site scripting
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS:Referer "@detectXSS" \
    "id:8000930,phase:2,deny,status:403,log,auditlog,t:none,t:utf8toUnicode,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:removeNulls,\
    msg:'ZySentinel (cadangan): XSS (libinjection)',tag:'zysentinel',tag:'attack-xss',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS:Referer "@rx (?:<[\s/]*script|javascript[\s]*:|vbscript[\s]*:|<[\s/]*iframe|<[\s/]*object|<[\s/]*embed|<[^>]{0,80}[\s/\x22'](?:onerror|onload|onclick|onmouseover|onfocus|onmouseenter|onanimationstart)[\s]*=|document\.cookie|<[\s/]*svg[^>]{0,80}on[a-z]+[\s]*=)" \
    "id:8000931,phase:2,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:removeNulls,t:lowercase,\
    msg:'ZySentinel (cadangan): XSS (pola)',tag:'zysentinel',tag:'attack-xss',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# Command injection dan kode PHP
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES "@rx (?:[;|`&]|\$\(|\$\{ifs\})[\s]*(?:cat|ls|id|whoami|uname|wget|curl|bash|sh|nc|netcat|python[0-9]?|perl|php|powershell|cmd(?:\.exe)?|chmod|rm)(?:[\s;|&<>]|$)" \
    "id:8000940,phase:2,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,t:removeNulls,t:lowercase,\
    msg:'ZySentinel (cadangan): command injection',tag:'zysentinel',tag:'attack-rce',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_BODY "@rx (?:(?:base64_decode|eval|assert|system|passthru|shell_exec|proc_open|popen|phpinfo|file_put_contents)[\s]*\(|<\?php|(?:gopher|file|phar|zlib|ftp|ldap|dict|expect|glob|php)://)" \
    "id:8000941,phase:2,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,t:removeNulls,t:lowercase,\
    msg:'ZySentinel (cadangan): injeksi kode PHP atau wrapper stream',tag:'zysentinel',tag:'attack-rce',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# Log4Shell / JNDI
SecRule REQUEST_URI|ARGS|REQUEST_HEADERS|REQUEST_COOKIES "@rx \$\{[\s]*(?:jndi|lower|upper|env|sys|java|date)[\s]*:" \
    "id:8000942,phase:2,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,t:lowercase,\
    msg:'ZySentinel (cadangan): injeksi JNDI/Log4Shell',tag:'zysentinel',tag:'attack-rce',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR_NAME}'"

# XXE
SecRule REQUEST_BODY|XML:/* "@rx <!(?:doctype|entity)[^>]{0,300}(?:system|public)" \
    "id:8000950,phase:2,deny,status:403,log,auditlog,t:none,t:removeNulls,t:lowercase,\
    msg:'ZySentinel (cadangan): XXE',tag:'zysentinel',tag:'attack-xxe',severity:'CRITICAL'"

SecMarker ZY_END_FALLBACK2
