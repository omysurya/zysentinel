# ============================================================
# ZySentinel Rules: aturan utama (dimuat SEBELUM OWASP CRS)
#
# Hanya melengkapi yang tidak dicakup CRS. Tidak menambah skor anomali CRS:
# keputusan blokir dibuat langsung di sini (deny 403), sehingga tidak
# bergantung pada versi CRS. Semua regex memakai subset RE2 (tanpa
# lookahead/backreference) agar sama di Coraza (Go) dan ModSecurity (PCRE).
# ID 8000000-8099999.
# ============================================================

# zy_skip diinisialisasi 0: operator negasi pada variabel yang belum ada tidak pernah cocok di Coraza.
SecAction "id:8000001,phase:1,pass,nolog,t:none,setvar:tx.zy_loaded=1,setvar:tx.zy_skip=0"

# ---------------------------------------------------------------- pengecualian
# Validasi sertifikat (ACME acme-challenge, pki-validation): aturan 8000010 ditulis sentinel-zyrules.py di kepala gen/lists.conf,
# SEBELUM daftar hitam IP, supaya tidak ada aturan yang bisa menolak server validasi CA.

# Halaman blocker (error page internal) tidak boleh diperiksa ulang: sebagian
# web server (OpenLiteSpeed) membawa query string asli ke halaman itu sehingga
# permintaan yang sama terblokir lagi dan terjadi loop.
SecRule REQUEST_FILENAME "@streq /__zysentinel_403.html" \
    "id:8000012,phase:1,pass,nolog,t:none,ctl:ruleEngine=Off,setvar:tx.zy_skip=1"

# Klien API sah (aplikasi mobile, server-ke-server) mengirim parameter bernama sessionID/session_id
# tanpa header Referer. CRS 943120 (session fixation, PL1, skor kritis) menolaknya semua. Ditemukan
# pada lalu lintas nyata aplikasi SenTris (/api/v1/...): 134 permintaan sah terblokir. Aturan itu
# dikecualikan khusus untuk jalur /api/ dan /v<N>/; di jalur lain tetap berlaku.
SecRule REQUEST_FILENAME "@rx ^/(?:api|v[0-9]+)(?:/|$)" \
    "id:8000480,phase:1,pass,nolog,t:none,t:lowercase,ctl:ruleRemoveById=943120"

SecRule TX:ZY_SKIP "@eq 1" "id:8000011,phase:1,pass,nolog,t:none,skipAfter:ZY_END_PHASE1"

# ------------------------------------------------- berkas dan folder sensitif
# Transformasi: decode URL dua kali (menangkap %252e), hapus null,
# normalisasi path, huruf kecil.

# Repositori kode: .git/ .svn/ .hg/ .bzr/ .cvs/
SecRule REQUEST_FILENAME "@rx (?:^|/)\.(?:git|svn|hg|bzr|cvs)(?:ignore|attributes|config|modules|keep)?(?:/|$)" \
    "id:8000101,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses repositori kode (.git/.svn/.hg)',tag:'zysentinel',tag:'attack-sensitive-file',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# Berkas lingkungan: .env .env.local .env.production .env.bak ...
SecRule REQUEST_FILENAME "@rx (?:^|/)\.env(?:[._-][a-z0-9._-]*)?(?:/|$)" \
    "id:8000102,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses berkas lingkungan (.env)',tag:'zysentinel',tag:'attack-sensitive-file',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# Berkas kendali akses server: .htaccess .htpasswd .htdigest .htgroup .user.ini
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:\.ht(?:access|passwd|digest|group|users)(?:[._~-][a-z0-9._~-]*)?|\.(?:user|php)\.ini)$" \
    "id:8000103,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses berkas kendali akses (.htpasswd/.htaccess)',tag:'zysentinel',tag:'attack-sensitive-file',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# Riwayat shell/database dan kredensial dalam dotfile; folder konfigurasi pengguna
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:\.(?:bash_history|bashrc|zsh_history|zshrc|sh_history|mysql_history|psql_history|rediscli_history|python_history|node_repl_history|lesshst|viminfo|netrc|npmrc|yarnrc|pypirc|pgpass|my\.cnf|s3cfg|boto|git-credentials|gitconfig|msmtprc|dockercfg|ds_store)|\.(?:ssh|aws|azure|kube|docker|gnupg|gcloud|idea|vscode|terraform|ansible|bundle|cargo|gem|npm)(?:/|$))" \
    "id:8000104,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses dotfile kredensial atau folder konfigurasi',tag:'zysentinel',tag:'attack-sensitive-file',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# Kunci privat dan sertifikat
SecRule REQUEST_FILENAME "@rx (?:(?:^|/)(?:id_(?:rsa|dsa|ecdsa|ed25519)(?:\.pub)?|authorized_keys|known_hosts)$|\.(?:pem|key|p12|pfx|jks|keystore|ppk|kdbx|gpg)$)" \
    "id:8000105,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses kunci privat atau sertifikat',tag:'zysentinel',tag:'attack-sensitive-file',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# API key, secret, dan kredensial yang tersimpan sebagai berkas
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:credentials?|secrets?|secret[_-]?keys?|api[_-]?keys?|apikeys?|access[_-]?keys?|access[_-]?tokens?|auth[_-]?tokens?|private[_-]?keys?|client[_-]?secrets?|service[_-]?account[a-z0-9_-]*|[a-z0-9_-]*firebase[a-z0-9_-]*adminsdk[a-z0-9_-]*|tokens?|passwords?|passwd|shadow)\.(?:json|ya?ml|txt|ini|conf|cfg|env|xml|properties|toml|csv|bak|old|key|pem)$" \
    "id:8000106,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses berkas API key atau kredensial',tag:'zysentinel',tag:'attack-sensitive-file',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# Cadangan, dump database, berkas sementara editor, dan arsip bernama cadangan
SecRule REQUEST_FILENAME "@rx (?:\.(?:bak|backup|old|orig|save|swp|swo|sql|sqlite3?|dump)$|~$|\.(?:php|inc|ini|conf|config|cfg|ya?ml|json|xml|env)\.(?:bak|backup|old|orig|save|swp|swo|txt|dist|tmp|zip)$|(?:^|/)(?:backup|backups|dump|dumps|database|db|site|www|wwwroot|public_html|web|html|full|export|data)(?:[_-][a-z0-9._-]*)?\.(?:zip|rar|7z|tar|tar\.gz|tgz|gz|bz2|sql)$)" \
    "id:8000107,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses cadangan, dump database, atau berkas sementara',tag:'zysentinel',tag:'attack-sensitive-file',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# Berkas konfigurasi aplikasi dan infrastruktur
SecRule REQUEST_FILENAME "@rx (?:(?:^|/)(?:wp-config\.php[._~-][a-z0-9._~-]*|web\.config|appsettings(?:\.[a-z0-9]+)?\.json|\.gitlab-ci\.yml|\.travis\.yml|jenkinsfile|docker-compose(?:\.[a-z0-9-]+)?\.ya?ml|dockerfile(?:\.[a-z0-9-]+)?|vagrantfile|ansible\.cfg|terraform\.tfstate(?:\.backup)?|\.circleci/|\.github/workflows/|\.terraform/)|\.(?:tfstate|tfvars)$)" \
    "id:8000108,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses berkas konfigurasi aplikasi atau infrastruktur',tag:'zysentinel',tag:'attack-sensitive-file',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# Manifest dependensi dan berkas penanda proyek (kebocoran informasi):
# ditolak hanya pada mode ketat, selain itu dicatat.
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|gemfile(?:\.lock)?|requirements\.txt|pipfile(?:\.lock)?|pom\.xml|build\.gradle|go\.(?:mod|sum)|phpunit\.xml(?:\.dist)?|\.phpunit\.result\.cache)$" \
    "id:8000110,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses manifest dependensi (mode ketat)',tag:'zysentinel',tag:'attack-info-disclosure',severity:'ERROR',\
    logdata:'%{MATCHED_VAR}',chain"
    SecRule TX:ZY_STRICT "@eq 1" "t:none"

SecRule REQUEST_FILENAME "@rx (?:^|/)(?:composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|gemfile(?:\.lock)?|requirements\.txt|pipfile(?:\.lock)?|pom\.xml|build\.gradle|go\.(?:mod|sum)|phpunit\.xml(?:\.dist)?|\.phpunit\.result\.cache)$" \
    "id:8000111,phase:1,pass,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses manifest dependensi (dicatat)',tag:'zysentinel',tag:'attack-info-disclosure',severity:'WARNING',\
    logdata:'%{MATCHED_VAR}',chain"
    SecRule TX:ZY_STRICT "@eq 0" "t:none"

# Endpoint debug dan informasi yang tidak ambigu
SecRule REQUEST_FILENAME "@rx (?:^|/)(?:phpinfo(?:\.php)?|php_info\.php|info\.php|adminer(?:-[0-9.]+)?\.php|server-status|server-info|elmah\.axd|trace\.axd|actuator/(?:env|heapdump|configprops|mappings|beans|threaddump|loggers)|debug/pprof|\.vscode/sftp\.json)(?:/|$)" \
    "id:8000115,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: akses endpoint debug/informasi',tag:'zysentinel',tag:'attack-info-disclosure',severity:'ERROR',\
    logdata:'%{MATCHED_VAR}'"

# ------------------------------------------------ webshell dan jalur eksploit
SecRule REQUEST_FILENAME "@rx (?:/vendor/phpunit/.*eval-stdin\.php$|/(?:hack|shell|spy|phpspy|c99|r57|wso|b374k|alfa|indoxploit|webshell|backdoor)\.php$|/cgi-bin/(?:\.%2e|\.\./)|/boaform/|/hnap1|/setup\.cgi$)" \
    "id:8000120,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: webshell atau jalur eksploit dikenal',tag:'zysentinel',tag:'attack-webshell',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# Skrip dijalankan dari folder unggahan/statis
SecRule REQUEST_FILENAME "@rx ^/(?:uploads?|uploadfiles|attachments?|forumdata|avatars?|wp-content/uploads|public/uploads?|storage/app/public)/.*\.(?:php[0-9]?|phtml|phar|jsp|jspx|asp|aspx|cgi|pl)$" \
    "id:8000121,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: eksekusi skrip dari folder unggahan',tag:'zysentinel',tag:'attack-webshell',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# Situs judi online dan penambang kripto (injeksi defacement / SEO spam)
SecRule REQUEST_FILENAME "@rx /(?:slot88|slot[\s_-]*gacor|judi[\s_-]*online|sbobet|maxwin|zeus[\s_-]*slot|toto[\s_-]*macau|bandar[\s_-]*togel|link[\s_-]*gacor|pragmatic[\s_-]*play|coinhive|cryptonight|webminepool|minr\.pw|xmr\.wasm)" \
    "id:8000125,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:lowercase,\
    msg:'ZySentinel: URL judi online atau penambang kripto',tag:'zysentinel',tag:'attack-spam',severity:'ERROR',\
    logdata:'%{MATCHED_VAR}'"

# ----------------------------------------------------------- pemindai (scanner)
SecRule REQUEST_HEADERS_NAMES "@rx ^(?:acunetix-aspect(?:-password|-queries)?|x-wipp|x-requestmanager-memo|x-request-memo|x-scan-memo)$" \
    "id:8000130,phase:1,deny,status:403,log,auditlog,t:none,t:lowercase,\
    msg:'ZySentinel: header khas pemindai kerentanan',tag:'zysentinel',tag:'attack-scanner',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR_NAME}'"

SecRule REQUEST_URI|REQUEST_COOKIES_NAMES "@rx (?:acunetix-wvs-test-for-some-inexistent-file|acunetix_wvs_security_test|netsparker|appscan|xss@here|acunetixcookie)" \
    "id:8000131,phase:1,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,\
    msg:'ZySentinel: penanda pemindai kerentanan di URL atau cookie',tag:'zysentinel',tag:'attack-scanner',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

SecRule REQUEST_HEADERS:User-Agent "@pmFromFile zy-scanner-ua.data" \
    "id:8000132,phase:1,deny,status:403,log,auditlog,t:none,t:lowercase,\
    msg:'ZySentinel: User-Agent pemindai atau alat serangan',tag:'zysentinel',tag:'attack-scanner',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

# Expect: hanya 100-continue yang sah (CRS menolak semua nilai Expect; lihat sentinel-zyrules.py).
SecRule REQUEST_HEADERS:Expect "@rx ." \
    "id:8000216,phase:1,deny,status:400,log,auditlog,t:none,\
    msg:'ZySentinel: nilai header Expect tidak sah',tag:'zysentinel',tag:'attack-protocol',severity:'WARNING',chain"
    SecRule REQUEST_HEADERS:Expect "!@rx ^[[:space:]]*100-continue[[:space:]]*$" "t:none,t:lowercase"

# ===================================================================================
# Probe dan eksploit yang BENAR-BENAR diterima server ini (analisis error log dan access log
# semua vhost, 2025-12 sampai 2026-10). Tiap pola diuji terhadap seluruh log: nol akses sah
# (2xx di origin) yang akan terblokir. Dikelompokkan per modul supaya bisa dimatikan dari panel.
# Tag zys-cms dan zys-tools dapat dikecualikan per vhost (situs WordPress/phpMyAdmin yang sah,
# dideteksi otomatis oleh sentinel-zyrules.py).
# ===================================================================================

SecRule REQUEST_FILENAME "@rx (?:^|/)(?:wp-login\.php|wp-signup\.php|wp-trackback\.php|wp-cron\.php|xmlrpc\.php|wp-activate\.php|wp-mail\.php|wp-load\.php|wp-blog-header\.php|wp-settings\.php|wp-links-opml\.php|wp-admin(?:/|$)|wp-includes(?:/|$)|wp-content(?:/|$)|wp-json(?:/|$)|wp/v2/|^/(?:wordpress|wp)(?:/|$)|wlwmanifest\.xml|wp-config)" \
    "id:8000400,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
    msg:'ZySentinel: probe WordPress pada situs non-WordPress',tag:'zysentinel',tag:'zys-cms',tag:'attack-probe-cms',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR}'"

SecRule ARGS_GET:rest_route "@rx ." \
    "id:8000401,phase:1,deny,status:403,log,auditlog,t:none,t:removeNulls,t:urlDecodeUni,t:urlDecodeUni,t:normalizePathWin,t:lowercase,\
