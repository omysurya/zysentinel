    msg:'ZySentinel: baca berkas sensitif atau path traversal lewat parameter',tag:'zysentinel',tag:'attack-lfi',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',chain"
    SecRule TX:ZY_SKIP "@eq 0" "t:none"

# ------------------------------- PHP2Shell (CVE-2026-109618 / CVE-2026-109619): medan upload-progress
# Eksploit memicu jalur session.upload_progress lewat medan multipart bernama PHP_SESSION_UPLOAD_PROGRESS.
# Hanya aplikasi dengan bilah kemajuan unggah yang sah mengirimnya, jadi bawaannya MENCATAT (pass) agar tidak
# memutus aplikasi itu. Ganti "pass" menjadi "deny,status:403" bila di situs Anda medan ini tidak dipakai.
# Perbaikan sebenarnya: perbarui PHP (8.2.35, 8.3.36, 8.4.27, 8.5.12) atau session.upload_progress.enabled=Off.
SecRule ARGS_NAMES "@rx (?i)^php_session_upload_progress$" \
    "id:8000450,phase:2,pass,log,auditlog,t:none,t:removeNulls,\
    msg:'ZySentinel: medan upload-progress PHP (jalur PHP2Shell CVE-2026-109618/109619)',tag:'zysentinel',tag:'attack-php2shell',severity:'WARNING',\
    logdata:'%{MATCHED_VAR_NAME}',chain"
    SecRule TX:ZY_SKIP "@eq 0" "t:none"

