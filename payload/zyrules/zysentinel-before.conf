    logdata:'%{MATCHED_VAR}'"

# ------------------------------------------- injeksi lewat header pembawa IP
# Header ini seharusnya berisi alamat IP saja, tetapi banyak aplikasi memakainya
# langsung di SQL/log/template, dan CRS tidak memeriksanya. Karakter kutip, tanda
# kurung, titik koma, dan kata kunci SQL tidak pernah sah di sini.
SecRule REQUEST_HEADERS:X-Forwarded-For|REQUEST_HEADERS:X-Real-IP|REQUEST_HEADERS:Client-IP|REQUEST_HEADERS:True-Client-IP|REQUEST_HEADERS:CF-Connecting-IP|REQUEST_HEADERS:X-Client-IP|REQUEST_HEADERS:X-Originating-IP|REQUEST_HEADERS:X-Cluster-Client-IP|REQUEST_HEADERS:X-Forwarded-Host "@rx (?:[\x27\x22<>;(){}|$`\x5c]|--|/\*|\b(?:select|union|sleep|benchmark|exec|insert|update|delete|drop)\b)" \
    "id:8000170,phase:1,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,\
    msg:'ZySentinel: karakter injeksi di header pembawa IP',tag:'zysentinel',tag:'attack-injection',severity:'CRITICAL',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

