# ------------------------------------- baca berkas lewat parameter (LFI ringan)
# Traversal dan nama berkas sensitif di dalam nilai parameter. CRS juga
# memeriksa ini; aturan ini hanya mempercepat penolakan kasus yang jelas.
SecRule ARGS|REQUEST_COOKIES "@rx (?:^|[/\x5c])\.(?:env|git|svn|htpasswd|htaccess|ssh|aws)(?:[/\x5c.]|$)|(?:\.\.[/\x5c]){2,}|(?:/etc/(?:passwd|shadow|hosts)|/proc/self/environ|boot\.ini|win\.ini)(?:$|[^a-z0-9])" \
