# ============================================================
# ZySentinel Rules: pengaturan (nilai bawaan)
#
# Berkas ini dimuat PERTAMA. Ubah nilai di zysentinel-config.local.conf
# (dimuat sesudahnya, tidak ditimpa pembaruan plugin).
#
# Rentang ID aturan milik ZySentinel: 8000000 - 8099999.
# Rentang ini sengaja terpisah dari OWASP CRS (900000-999999) dan
# plugin CRS (9000000-9999999) supaya tidak bentrok.
# ============================================================

# Mode ketat: 1 = berkas informasi (composer.json, package.json, dst.)
# juga ditolak. 0 = hanya dicatat.
SecAction "id:8000002,phase:1,pass,nolog,t:none,setvar:tx.zy_strict=0"

# Tingkat penjagaan bot:
#   0 = mati
#   1 = scraper/harvester agresif dan pemindai (bawaan)
#   2 = + crawler SEO/AI dan permintaan tanpa User-Agent
#   3 = + pustaka HTTP generik (curl, wget, python-requests, dst.); bisa
#       mengganggu API dan monitoring, aktifkan hanya bila perlu
SecAction "id:8000003,phase:1,pass,nolog,t:none,setvar:tx.zy_bot_level=1"

# Aturan cadangan SQLi/XSS/traversal: hanya berjalan bila OWASP CRS TIDAK
# dimuat. 1 = otomatis (bawaan), 0 = selalu mati.
SecAction "id:8000004,phase:1,pass,nolog,t:none,setvar:tx.zy_fallback=1"
