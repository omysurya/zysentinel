<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>403 Forbidden - Protected by ZySens</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  height:100dvh;
  margin:0;
  padding:0;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#090d16;
  color:#f1f5f9;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:16px;
  user-select:none;
  -webkit-user-select:none;
}
.card{
  text-align:center;
  max-width:390px;
  width:100%;
  max-height:92vh;
  max-height:92dvh;
  padding:28px 24px 22px;
  background:#0f172a;
  border:1px solid rgba(14,165,233,0.22);
  border-radius:14px;
  box-shadow:0 16px 36px rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.logo{
  width:42px;
  height:42px;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.logo svg{width:100%;height:100%}
h1{
  font-size:19px;
  font-weight:700;
  letter-spacing:-0.01em;
  color:#f87171;
  margin-bottom:6px;
  line-height:1.2;
}
p{
  font-size:13px;
  color:#94a3b8;
  line-height:1.5;
  margin-bottom:15px;
}
.meta{
  display:inline-block;
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:11px;
  color:#64748b;
  background:rgba(30,41,59,0.8);
  padding:4px 10px;
  border-radius:6px;
  margin-bottom:18px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}
.footer{
  font-size:11px;
  color:#475569;
  letter-spacing:0.02em;
}
.footer span{color:#0ea5e9;font-weight:600}
@media (max-height: 480px){
  body{padding:8px}
  .card{padding:14px 18px 12px;border-radius:10px}
  .logo{width:32px;height:32px;margin-bottom:8px}
  h1{font-size:16px;margin-bottom:4px}
  p{font-size:11.5px;margin-bottom:8px;line-height:1.3}
  .meta{margin-bottom:10px;padding:2px 8px;font-size:10px}
  .footer{font-size:10px}
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 4L6 12V22C6 33.1 13.7 43.4 24 46C34.3 43.4 42 33.1 42 22V12L24 4Z" fill="#1e293b" stroke="#0ea5e9" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M24 13V35M15 22L24 13L33 22" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>403 Forbidden</h1>
  <p>Permintaan Anda diblokir oleh sistem keamanan web server karena terdeteksi anomali atau ancaman.</p>
  <div class="meta">IP: {{CLIENT_IP}} &bull; ID: {{REQ_ID}}</div>
  <div class="footer">protected by <span>ZySens</span></div>
</div>
</body>
</html>
