name: Build & Publish ZySentinel aaPanel Plugin Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: false
        default: 'v1.6.2'

permissions:
  contents: write

jobs:
  build-release:
    name: Build aaPanel Plugin Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building ZySentinel Plugin Release: ${TAG}"

      - name: Pemeriksaan edisi Free (I1)
        run: python3 .github/i1_check.py .

      - name: Compile guardd from source (hardened)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc libsqlite3-dev
          gcc -O2 -Wall -Wextra -fstack-protector-strong -D_FORTIFY_SOURCE=2 -fPIE -pie -Wl,-z,relro,-z,now \
              -o payload/guardd payload/guardd.c -lsqlite3 -lm
          sha256sum payload/guardd.c | awk '{print $1}' > payload/guardd.srchash

      - name: Prepare Clean aaPanel Plugin Package
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          STAGE_DIR="/tmp/sentinel_build/sentinel"
          rm -rf /tmp/sentinel_build
          mkdir -p "$STAGE_DIR"

          # Salin seluruh berkas proyek ke staging folder sentinel
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='*.bak.*' \
                    --exclude='*.bak' \
                    --exclude='__pycache__' \
                    --exclude='*.pyc' \
                    --exclude='build-release.sh' \
                    --exclude='bump-version.sh' \
                    --exclude='versi.py' \
                    --exclude='CONTRIBUTING.md' \
                    --exclude='tests' \
                    ./ "$STAGE_DIR/"

          # Pastikan hak akses berkas biner & skrip dapat dieksekusi
          chmod 755 "$STAGE_DIR/install.sh"
          chmod 755 "$STAGE_DIR/payload"/*.sh "$STAGE_DIR/payload"/*.py "$STAGE_DIR/payload"/guardctl 2>/dev/null || true
          [ -f "$STAGE_DIR/payload/guardd" ] && chmod 755 "$STAGE_DIR/payload/guardd" || true
          find "$STAGE_DIR/payload/systemd" -type f -exec chmod 644 {} + 2>/dev/null || true
          [ -f "$STAGE_DIR/payload/init.d/sentinel" ] && chmod 755 "$STAGE_DIR/payload/init.d/sentinel" || true

          # Buat arsip ZIP resmi siap upload ke aaPanel
          cd /tmp/sentinel_build
          zip -r -9 "${GITHUB_WORKSPACE}/sentinel.zip" sentinel/
          cp "${GITHUB_WORKSPACE}/sentinel.zip" "${GITHUB_WORKSPACE}/zysentinel-${TAG}.zip"

          cd "${GITHUB_WORKSPACE}"
          sha256sum sentinel.zip zysentinel-${TAG}.zip > SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "ZySentinel ${{ steps.vars.outputs.tag }}"
          body: |
            ### ZySentinel ${{ steps.vars.outputs.tag }} — AI-Powered aaPanel Security, Free Edition

            Lindungi server aaPanel Anda hari ini, gratis dan open source: firewall kernel dengan kontrol port (hingga 10 aturan),
            WAF untuk 1 situs, pemantauan serangan realtime, Process Guard mode audit, pemindaian antivirus ClamAV, dan dasbor keamanan
            yang menampilkan semuanya dalam satu layar.

            #### ✨ Segera Hadir: ZySentinel Pro & Max
            Fitur kelas enterprise kini sudah terlihat di panel Anda dengan lencana **SOON**, siap dibuka begitu Pro & Max meluncur:
            - 🛡️ **Pemblokiran otomatis** penyerang, Anti-DDoS terkonfigurasi, dan blokir per negara
            - 🌐 **WAF untuk semua situs** dengan aturan ZySentinel dan paket aturan premium
            - 📤 **Upload Protection realtime** dan karantina otomatis
            - 🕵️ **Webshell Sweeper**, pemindai memori **PHP2Shell**, dan Egress Guard
            - ♻️ **Self-Heal** layanan, Threat Intel otomatis, notifikasi webhook, dan banyak lagi

            Ikuti kabarnya di **https://zysens.com**.

            ---
            *Coming soon: ZySentinel Pro & Max. Enterprise-grade features (auto-blocking, WAF for every site, realtime upload
            protection, webshell sweeper, PHP2Shell memory scanner, self-heal, and more) are already visible in your panel
            with a **SOON** badge.*

            Paket rilis resmi ZySentinel siap impor untuk aaPanel (Linux).

            #### 📦 Aset Siap Pakai:
            - **`sentinel.zip`** : Paket utama plugin untuk diunggah langsung ke **aaPanel App Store** (`Import Third-party Plugin`).
            - **`zysentinel-${{ steps.vars.outputs.tag }}.zip`** : Arsip rilis berlabel versi.
            - **`SHA256SUMS.txt`** : Checksum verifikasi integritas berkas.

            #### 🚀 Cara Pemasangan di aaPanel:
            1. Unduh berkas **`sentinel.zip`** dari daftar aset di bawah.
            2. Masuk ke dasbor **aaPanel** Anda.
            3. Buka menu **App Store** → klik tab **Third-party plugin** (atau **Plugin Import**).
            4. Klik **Import Plugin / Upload Plugin** dan pilih berkas `sentinel.zip`.
            5. aaPanel akan otomatis mengekstrak dan menjalankan setup mandiri (`install.sh`).
            6. Seluruh modul (Firewall, WAF, EDR Runtime, Antivirus, dan Dasbor) langsung aktif dan siap digunakan!
          draft: false
          prerelease: false
          files: |
            sentinel.zip
            zysentinel-${{ steps.vars.outputs.tag }}.zip
            SHA256SUMS.txt
